# O2J — OpenAPI to Java Spring Boot conversion factory
# Single source of truth for versions, targets and gate thresholds.
# See SPECIFICATION.md §8.2. Validated against o2j/schemas/o2j-config.schema.json.
version: 1

service:
  name: order-service
  group_id: com.acme.commerce
  artifact_id: order-service
  base_package: com.acme.commerce.order
  profile: production            # production | sandbox

target:
  java_version: 21               # Tier 1: 17, 21, 25 | Tier 2 (best effort): 23, 26, 27
  spring_profile: spring-boot-3  # spring-boot-3 | spring-boot-4
  build_tool: maven
  web_stack: mvc

# Pinned versions. Never inline a version anywhere else.
# Refresh with: o2j doctor --check-versions
versions:
  openapi_generator: 7.27.0
  spring_boot: 3.5.16            # NOTE: OSS EOL 2026-06-30. See SPECIFICATION.md §3.1 (RISK-01).
  spring_boot_4: 4.1.0
  mapstruct: 1.6.3
  jacoco: 0.8.13
  pitest: 1.17.4
  pitest_junit5: 1.2.1
  spotless: 2.44.0
  checkstyle: 3.6.0
  pmd: 3.26.0
  spotbugs: 4.8.6.6
  archunit: 1.3.0
  testcontainers: 1.20.6
  springdoc: 2.7.0               # Spring Boot 3 line
  springdoc_boot_4: 3.0.3        # Spring Boot 4 line (used by the spring-boot-4 profile)
  owasp_dependency_check: 11.1.0
  cyclonedx: 2.9.1

openapi:
  input: openapi/spec.raw.yaml
  canonical_version: "3.1.2"
  allow_remote_refs: false
  remote_ref_allowlist: []
  max_inline_schemas: 0
  max_allof_depth: 3
  max_document_bytes: 10485760   # 10 MiB

validation:
  spectral_ruleset: o2j/rules/spectral/house-api.yaml
  fail_on: error                 # error | warn
  breaking_change_baseline: null # path to the previous spec, or null
  require_security: true
  require_pagination_on_collections: true
  require_problem_details: true

generation:
  delegate_pattern: true
  interface_only: false
  use_tags: true
  use_optional: false
  use_bean_validation: true
  perform_bean_validation: true
  open_api_nullable: false
  hide_generation_timestamp: true   # MUST remain true — determinism gate depends on it
  serializable_model: true
  unhandled_exception: true
  documentation_provider: springdoc
  annotation_library: swagger2
  template_overrides: o2j/templates
  output_dir: target/generated-sources/openapi

quality:
  coverage:
    line_min: 85
    branch_min: 80
    service_layer_line_min: 90
    exclude:
      - "**/api/model/**"
      - "**/api/*Api.class"
      - "**/api/*ApiController.class"
      - "**/Application.class"
      - "**/config/**"
  mutation:
    enabled: true
    threshold: 70
    coverage_threshold: 85
    target_packages:
      - "com.acme.commerce.order.service.*"
  static_analysis:
    spotless: true
    checkstyle: true
    pmd: true
    spotbugs: true
    archunit: true
    owasp_dependency_check: true
    gitleaks: true
  sonar:
    enabled: false
    project_key: ""

# TIBCO EMS request/reply queues this service replaces. When enabled, o2j validates the mapping
# against the spec at plan time and generates an EMS bridge (EmsBridge) that keeps legacy
# consumers working while they move to HTTP, plus a contract test for it on an embedded broker.
# See README, "Replacing TIBCO EMS queues".
ems:
  enabled: false
  reply_timeout_ms: 5000           # default reply deadline; a slower call replies 504/TIMEOUT
  routes: []
  # routes:
  #   - destination: ORDERS.CREATE.REQUEST
  #     operation: createOrder
  #     correlation: message-id      # message-id | correlation-id
  #     reply_timeout_ms: 3000
  #     params:                      # HTTP parameter -> where it comes from in the message
  #       Idempotency-Key: jms:JMSMessageID
  #     faults:                      # HTTP status -> legacy fault code consumers expect
  #       409: ORD-DUPLICATE
  #   - destination: ORDERS.GET.REQUEST
  #     operation: getOrder
  #     correlation: correlation-id
  #     params:
  #       orderId: json:/orderId     # JSON pointer into the message body
  #     faults:
  #       404: ORD-NOT-FOUND
