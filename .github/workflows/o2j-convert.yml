name: O2J Convert

# Each pipeline stage is its own step, so a failure names the stage rather than burying it in
# one long log. Exit codes are in SPECIFICATION.md section 8.4.

on:
  workflow_dispatch:
    inputs:
      spec_path:
        description: A spec file, or a folder of *.yaml/*.yml specs (one service each)
        required: true
        default: openapi
      java_version:
        description: Target Java version (17, 21, 25)
        required: false
        default: "21"
  pull_request:
    paths:
      - "openapi/**"
      - "o2j.yaml"
      - "o2j/**"

permissions:
  contents: read
  security-events: write   # SARIF upload

concurrency:
  group: o2j-convert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convert:
    runs-on: ubuntu-latest
    env:
      # Pinned so formatting and sort order cannot vary by runner locale, which would break
      # the determinism gate for no real reason.
      LC_ALL: C
      TZ: UTC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version || '21' }}
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install o2j
        run: pip install -e .

      - name: Preflight
        run: python -I -m o2j doctor

      # Folder mode: every *.yaml / *.yml under openapi/ becomes its own service in
      # generated_Code/<spec-name>/, with stage artifacts in work/<spec-name>/.
      - name: S0-S4 Ingest, validate, normalize, plan, generate
        run: python -I -m o2j run "${{ inputs.spec_path || 'openapi' }}" --to generate

      - name: Upload validation findings
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: work
          category: o2j-openapi

      - name: S6-S7 Build, test and gate every service
        run: python -I -m o2j run "${{ inputs.spec_path || 'openapi' }}" --from gate --to gate

      - name: S8 Report
        if: always()
        run: python -I -m o2j run "${{ inputs.spec_path || 'openapi' }}" --from report

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o2j-artifacts-java${{ inputs.java_version || '21' }}
          path: |
            work/**/*.json
            work/**/*.md
            work/**/*.yaml
            generated_Code/**/target/site/jacoco/**
            generated_Code/**/target/pit-reports/**
          if-no-files-found: warn
