name: O2J Lint

# Repository hygiene and advisory OpenAPI linting. The blocking OpenAPI gate is `o2j validate`
# inside O2J Convert; this workflow runs the same pre-commit hooks developers run locally
# (YAML, GitHub Actions, Markdown, Python, o2j validate) plus Spectral as a second opinion.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write   # SARIF upload for Spectral findings

concurrency:
  group: o2j-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install o2j and pre-commit
        run: pip install -e ".[dev]"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: pre-commit (yamllint, actionlint, markdownlint, ruff, mypy, o2j validate)
        run: pre-commit run --all-files --show-diff-on-failure

  spectral:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install o2j
        run: pip install -e .

      - name: Check for specs
        id: specs
        run: |
          if compgen -G "openapi/*.yaml" > /dev/null || compgen -G "openapi/*.yml" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # Advisory: findings are uploaded to code scanning but do not fail the build.
      # Pass --strict to make Spectral errors blocking.
      - name: Spectral (house ruleset + spectral:oas)
        if: steps.specs.outputs.present == 'true'
        run: python -I -m o2j lint openapi --tool npx

      - name: Upload Spectral findings
        if: always() && steps.specs.outputs.present == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: work/01-validate/lint-report.sarif
          category: o2j-spectral
