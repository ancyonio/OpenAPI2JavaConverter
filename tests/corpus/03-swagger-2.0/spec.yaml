# Swagger 2.0 input, exercising the constructs that change shape rather than merely move:
# definitions, a body parameter, produces/consumes, and the host/basePath/schemes triple.
swagger: "2.0"
info:
  title: Legacy Customer Service
  version: 1.0.0

host: legacy.example.com
basePath: /api/v1
schemes:
  - https

consumes:
  - application/json
produces:
  - application/json

securityDefinitions:
  oauth2:
    type: oauth2
    flow: application
    tokenUrl: https://auth.example.com/oauth2/token
    scopes:
      customers:read: Read customers
      customers:write: Write customers

paths:
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      security:
        - oauth2: [customers:read]
      parameters:
        - name: page
          in: query
          required: false
          type: integer
          minimum: 0
      responses:
        "200":
          description: Customers
          schema:
            type: array
            items:
              $ref: "#/definitions/Customer"
        "400":
          description: Invalid
          schema:
            $ref: "#/definitions/Problem"
        "401":
          description: Unauthenticated
          schema:
            $ref: "#/definitions/Problem"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/Problem"
        "500":
          description: Error
          schema:
            $ref: "#/definitions/Problem"

    post:
      operationId: createCustomer
      tags: [customers]
      security:
        - oauth2: [customers:write]
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/CreateCustomerRequest"
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/Customer"
        "400":
          description: Invalid
          schema:
            $ref: "#/definitions/Problem"
        "401":
          description: Unauthenticated
          schema:
            $ref: "#/definitions/Problem"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/Problem"
        "500":
          description: Error
          schema:
            $ref: "#/definitions/Problem"

definitions:
  Customer:
    type: object
    required: [id, email]
    properties:
      id:
        type: string
      email:
        type: string
      deletedAt:
        type: string
        format: date-time
        # 2.0 has no nullable keyword; after conversion to 3.0 and canonicalisation to the
        # 3.1 target this becomes a type union.
        x-nullable: true

  CreateCustomerRequest:
    type: object
    required: [email]
    properties:
      email:
        type: string

  Problem:
    type: object
    properties:
      type:
        type: string
      title:
        type: string
      status:
        type: integer
